# Builds the pkgdown site and publishes it to the gh-pages branch.
# Derived from https://github.com/r-lib/actions/tree/v2/examples
# Debugging help: https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    # A pull request builds the site to check that it still builds, but only
    # one deploying run may be in flight at a time.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      # Needed to push the built site to the gh-pages branch.
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The tutorial is an R Markdown vignette, so pandoc renders it.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `needs: website` picks up Config/Needs/website from DESCRIPTION, and
      # `local::.` installs uSDT itself so the vignette can fit the model.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
